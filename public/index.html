<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Commando AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px;
            background: #171717;
            border-bottom: 1px solid #292929;
            font-size: 22px;
            font-weight: bold;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            margin-bottom: 20px;
            max-width: 750px;
            line-height: 1.5;
        }

        .user {
            margin-left: auto;
            background: #252525;
            padding: 12px 16px;
            border-radius: 15px;
            width: fit-content;
        }

        .ai {
            background: #171717;
            padding: 12px 16px;
            border-radius: 15px;
            width: fit-content;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: #171717;
            border-top: 1px solid #292929;
        }

        input {
            flex: 1;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: #252525;
            color: white;
            font-size: 16px;
        }

        button {
            margin-left: 10px;
            padding: 0 20px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        🤖 Commando AI
    </header>

    <div id="chat">
        <div class="message ai">
            Merhaba! Ben Commando AI. 👋
        </div>
    </div>

    <div class="input-area">
        <input id="messageInput" type="text" placeholder="Mesajını yaz...">

        <button onclick="sendMessage()">
            Gönder
        </button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const chat = document.getElementById("chat");

            const message = input.value.trim();

            if (!message) return;

            chat.innerHTML += `
                <div class="message user">
                    ${message}
                </div>
            `;

            input.value = "";

            chat.innerHTML += `
                <div class="message ai" id="loading">
                    Düşünüyorum...
                </div>
            `;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                document.getElementById("loading").remove();

                chat.innerHTML += `
                    <div class="message ai">
                        ${data.reply}
                    </div>
                `;

                chat.scrollTop = chat.scrollHeight;

            } catch (error) {
                document.getElementById("loading").innerText =
                    "Bir hata oluştu.";
            }
        }

        document.getElementById("messageInput")
            .addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
            });
    </script>

</body>
