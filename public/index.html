```html
<!DOCTYPE html>
<html lang="tr">

    <meta charset="UTF-8">

    <title>Commando AI</title>

    <style>
        * {
            box-sizing: border-box;

        :root {
            --bg: #05070d;

            --panel: #0b1220;

        }

        /* TAM SİYAH */
        body.theme-black {

            --sidebar: #000000;
            --panel: #050505;
            --message-user: #0b0b0b;
            --message-ai: #050505;

            --accent: #ffffff;

        /* BEYAZ */
        body.theme-white {

            --sidebar: #f5f5f5;

            --message-user: #f0f0f0;

            --border: #dddddd;
            --text: #111111;

            --accent: #2563eb;

            --input: #f7f7f7;
        }

        .input-area {

        .input-container {
            max-width: 850px;

        }

        #messageInput {
            flex: 1;
            min-height: 42px;

        #messageInput::placeholder {

        }

        .send-button {

            height: 42px;

        .send-button:hover {

        .send-button:disabled {

        /* TYPING */

        .typing {

        .typing span {

        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {

        }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0.25;

        /* SCROLLBAR */

        ::-webkit-scrollbar {

        }

        ::-webkit-scrollbar-thumb {

        }

        /* MOBILE */

        @media (max-width: 700px) {
            .sidebar {
                position: fixed;
                z-index: 20;

            .sidebar.closed {
                transform: translateX(-100%);
                width: 260px;
            }

            .chat {
                padding: 16px;

            .welcome {
                margin-top: 45px;

            .welcome h1 {
                font-size: 25px;

            .message.user .message-box,
            .message.ai .message-box {

                padding: 10px;
            }

    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="brand">
                <div class="brand-icon">⚡</div>

                <div>
                    <div class="brand-title">Commando AI</div>
                    <div class="brand-subtitle">Yapay Zeka Asistanı</div>
                </div>
            </div>

            <button class="new-chat" onclick="newChat()">
                ＋ Yeni Sohbet
            </button>

        </div>

        <!-- TEMA -->
        <div class="theme-section">

            <div class="theme-title">
                Tema
            </div>

            <div class="theme-buttons">

                <button
                    class="theme-button"
                    id="themeNavy"
                    onclick="changeTheme('navy')">
                    Lacivert
                </button>

                <button
                    class="theme-button"
                    id="themeBlack"
                    onclick="changeTheme('black')">
                    Siyah
                </button>

                <button
                    class="theme-button"
                    id="themeWhite"
                    onclick="changeTheme('white')">
                    Beyaz
                </button>

            </div>

        </div>

        <div class="conversations" id="conversations"></div>

        <div class="sidebar-footer">
            Commando AI • 2026
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <button
                class="menu-button"
                onclick="toggleSidebar()">
                ☰
            </button>

            <div>
                <div class="top-title">
                    Commando AI
                </div>
            </div>

            <div class="online">
                ● Çevrimiçi
            </div>

        </header>

        <!-- CHAT -->
        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    ⚡
                </div>

                <h1>
                    Commando AI
                </h1>

                <p>
                    Sana nasıl yardımcı olabilirim?
                </p>

            </div>

            <div class="messages" id="messages"></div>

        </section>

        <!-- INPUT -->
        <div class="input-area">

            <div class="input-container">

                <textarea
                    id="messageInput"
                    placeholder="Commando AI'ya bir mesaj yaz..."
                    rows="1"></textarea>

                <button
                    class="send-button"
                    id="sendButton"
                    onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>

<script>

    /* =========================
       VERİLER
    ========================= */

    let conversations =
        JSON.parse(
            localStorage.getItem("commando_conversations") || "[]"
        );

    let activeConversation =
        localStorage.getItem("commando_active") || null;


    /* =========================
       TEMA
    ========================= */

    function changeTheme(theme) {

        document.body.classList.remove(
            "theme-black",
            "theme-white"
        );

        if (theme === "black") {
            document.body.classList.add("theme-black");
        }

        if (theme === "white") {
            document.body.classList.add("theme-white");
        }

        localStorage.setItem(
            "commando_theme",
            theme
        );

        updateThemeButtons();
    }


    function updateThemeButtons() {

        const theme =
            localStorage.getItem("commando_theme") || "navy";

        document
            .querySelectorAll(".theme-button")
            .forEach(button => {
                button.classList.remove("active");
            });

        if (theme === "navy") {
            document
                .getElementById("themeNavy")
                .classList.add("active");
        }

        if (theme === "black") {
            document
                .getElementById("themeBlack")
                .classList.add("active");
        }

        if (theme === "white") {
            document
                .getElementById("themeWhite")
                .classList.add("active");
        }
    }


    function loadTheme() {

        const savedTheme =
            localStorage.getItem("commando_theme") || "navy";

        changeTheme(savedTheme);
    }


    /* =========================
       SIDEBAR
    ========================= */

    function toggleSidebar() {

        const sidebar =
            document.getElementById("sidebar");

        sidebar.classList.toggle("closed");
    }


    /* =========================
       HTML GÜVENLİĞİ
    ========================= */

    function escapeHtml(text) {

        return String(text || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =========================
       YENİ SOHBET
    ========================= */

    function newChat() {

        const id =
            Date.now().toString();

        conversations.unshift({
            id: id,
            title: "Yeni Sohbet",
            messages: [],
            pinned: false
        });

        activeConversation = id;

        saveData();
        renderConversations();
        renderMessages();
    }


    /* =========================
       VERİ KAYDET
    ========================= */

    function saveData() {

        localStorage.setItem(
            "commando_conversations",
            JSON.stringify(conversations)
        );

        localStorage.setItem(
            "commando_active",
            activeConversation
        );
    }


    /* =========================
       SOHBETLER
    ========================= */

    function renderConversations() {

        const container =
            document.getElementById("conversations");

        container.innerHTML = "";

        conversations.forEach(conversation => {

            const item =
                document.createElement("div");

            item.className =
                "conversation" +
                (conversation.id === activeConversation
                    ? " active"
                    : "");

            item.innerHTML = `
                <span>💬</span>

                <div
                    class="conversation-title"
                    onclick="selectConversation('${conversation.id}')">
                    ${escapeHtml(conversation.title)}
                </div>

                <div class="conversation-actions">

                    <button
                        title="Sabitle"
                        onclick="event.stopPropagation(); togglePin('${conversation.id}')">
                        ${conversation.pinned ? "📌" : "📍"}
                    </button>

                    <button
                        title="Sil"
                        onclick="event.stopPropagation(); deleteConversation('${conversation.id}')">
                        🗑
                    </button>

                </div>
            `;

            container.appendChild(item);
        });
    }


    function selectConversation(id) {

        activeConversation = id;

        saveData();

        renderConversations();
        renderMessages();
    }


    function deleteConversation(id) {

        conversations =
            conversations.filter(
                conversation =>
                    conversation.id !== id
            );

        if (activeConversation === id) {

            if (conversations.length > 0) {
                activeConversation =
                    conversations[0].id;
            } else {
                newChat();
                return;
            }
        }

        saveData();

        renderConversations();
        renderMessages();
    }


    function togglePin(id) {

        const conversation =
            conversations.find(
                item => item.id === id
            );

        if (!conversation) return;

        conversation.pinned =
            !conversation.pinned;

        conversations.sort(
            (a, b) =>
                Number(b.pinned) -
                Number(a.pinned)
        );

        saveData();

        renderConversations();
    }


    /* =========================
       MESAJLARI GÖSTER
    ========================= */

    function renderMessages() {

        const messagesContainer =
            document.getElementById("messages");

        const welcome =
            document.getElementById("welcome");

        messagesContainer.innerHTML = "";

        const conversation =
            conversations.find(
                item => item.id === activeConversation
            );

        if (!conversation) {

            welcome.style.display = "block";

            return;
        }

        if (conversation.messages.length === 0) {

            welcome.style.display = "block";

            return;
        }

        welcome.style.display = "none";

        conversation.messages.forEach(message => {

            addMessageToScreen(
                message.role,
                message.content,
                false
            );

        });
    }


    /* =========================
       MESAJ EKLE
    ========================= */

    function addMessageToScreen(
        role,
        content,
        scroll = true
    ) {

        const container =
            document.getElementById("messages");

        const message =
            document.createElement("div");

        message.className =
            "message " +
            (role === "user"
                ? "user"
                : "ai");

        const author =
            role === "user"
                ? "Sen"
                : "Commando AI";

        message.innerHTML = `
            <div class="message-author">
                ${author}
            </div>

            <div class="message-box">
                ${escapeHtml(
                    String(content || "").trim()
                ).replace(/\n/g, "<br>")}
            </div>
        `;

        container.appendChild(message);

        if (scroll) {

            const chat =
                document.getElementById("chat");

            chat.scrollTop =
                chat.scrollHeight;
        }
    }


    /* =========================
       TYPING
    ========================= */

    function showTyping() {

        const container =
            document.getElementById("messages");

        const message =
            document.createElement("div");

        message.className =
            "message ai";

        message.id =
            "typingMessage";

        message.innerHTML = `
            <div class="message-author">
                Commando AI
            </div>

            <div class="message-box">

                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>
        `;

        container.appendChild(message);

        const chat =
            document.getElementById("chat");

        chat.scrollTop =
            chat.scrollHeight;
    }


    function removeTyping() {

        const typing =
            document.getElementById(
                "typingMessage"
            );

        if (typing) {
            typing.remove();
        }
    }


    /* =========================
       MESAJ GÖNDER
    ========================= */

    async function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );

        const sendButton =
            document.getElementById(
                "sendButton"
            );

        const message =
            input.value.trim();

        if (!message) return;

        /* Aktif sohbet yoksa oluştur */

        if (!activeConversation) {

            const id =
                Date.now().toString();

            conversations.unshift({
                id: id,
                title: message.slice(0, 35),
                messages: [],
                pinned: false
            });

            activeConversation = id;

        }

        const conversation =
            conversations.find(
                item => item.id === activeConversation
            );

        if (!conversation) return;

        /* İlk mesaj başlık olsun */

        if (
            conversation.messages.length === 0 ||
            conversation.title === "Yeni Sohbet"
        ) {

            conversation.title =
                message.slice(0, 35) +
                (message.length > 35 ? "..." : "");
        }

        /* Kullanıcı mesajı */

        conversation.messages.push({
            role: "user",
            content: message
        });

        input.value = "";
        input.style.height = "auto";

        saveData();

        renderConversations();

        addMessageToScreen(
            "user",
            message
        );

        sendButton.disabled = true;

        showTyping();

        try {

            const response =
                await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                });

            const data =
                await response.json();

            removeTyping();

            if (data.blocked) {

                addMessageToScreen(
                    "ai",
                    data.reply
                );

                conversation.messages.push({
                    role: "assistant",
                    content: data.reply
                });

                saveData();

                return;
            }

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Sunucu hatası"
                );
            }

            const reply =
                data.reply ||
                "Üzgünüm, cevap oluşturulamadı.";

            conversation.messages.push({
                role: "assistant",
                content: reply
            });

            saveData();

            addMessageToScreen(
                "ai",
                reply
            );

        } catch (error) {

            console.error(error);

            removeTyping();

            const errorMessage =
                "Üzgünüm, şu anda cevap oluşturulamadı.";

            conversation.messages.push({
                role: "assistant",
                content: errorMessage
            });

            saveData();

            addMessageToScreen(
                "ai",
                errorMessage
            );

        } finally {

            sendButton.disabled = false;

            input.focus();
        }
    }


    /* =========================
       ENTER
    ========================= */

    document
        .getElementById("messageInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();
                }
            }
        );


    /* =========================
       TEXTAREA BOYUTU
    ========================= */

    document
        .getElementById("messageInput")
        .addEventListener(
            "input",
            function() {

                this.style.height = "auto";

                this.style.height =
                    Math.min(
                        this.scrollHeight,
                        150
                    ) + "px";
            }
        );


    /* =========================
       BAŞLANGIÇ
    ========================= */

    if (conversations.length === 0) {

        const id =
            Date.now().toString();

        conversations.push({
            id: id,
            title: "Yeni Sohbet",
            messages: [],
            pinned: false
        });

        activeConversation = id;

        saveData();
    }

    loadTheme();
    renderConversations();
    renderMessages();

</script>

</body>
</html>
