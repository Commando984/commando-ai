```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commando AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #05070d;
    color: #f2f5ff;
    height: 100vh;
    overflow: hidden;
}

button, textarea {
    font-family: inherit;
}

.app {
    display: flex;
    height: 100vh;
    background:
        radial-gradient(circle at 70% 20%, rgba(15,48,110,.18), transparent 35%),
        #05070d;
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    min-width: 260px;
    background: #080d18;
    border-right: 1px solid #17243b;
    display: flex;
    flex-direction: column;
    transition: .25s ease;
    overflow: hidden;
}

.app.sidebar-closed .sidebar {
    width: 0;
    min-width: 0;
    border: none;
}

.sidebar-top {
    padding: 18px 16px 12px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
}

.brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg,#0b1d3d,#123b7a);
    border: 1px solid #1e4c91;
    box-shadow: 0 0 20px rgba(21,76,160,.25);
}

.brand-text strong {
    display: block;
    font-size: 15px;
}

.brand-text span {
    display: block;
    color: #6e7d98;
    font-size: 11px;
    margin-top: 2px;
}

.new-chat {
    width: 100%;
    border: 1px solid #1d427b;
    background: linear-gradient(135deg,#0d2348,#0a1730);
    color: #dceaff;
    padding: 11px 13px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
}

.new-chat:hover {
    background: #102b58;
}

.history-title {
    padding: 16px 16px 8px;
    color: #65738d;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
}

.conversation-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
}

.conversation {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px;
    margin-bottom: 3px;
    border-radius: 8px;
    color: #aab6cc;
    cursor: pointer;
    font-size: 12px;
}

.conversation:hover {
    background: #0d1628;
}

.conversation.active {
    background: #0e1d36;
    border: 1px solid #17345f;
}

.conversation-title {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.conversation-actions {
    display: flex;
    gap: 2px;
}

.conversation-actions button {
    border: none;
    background: transparent;
    color: #667590;
    cursor: pointer;
    padding: 3px;
}

.sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid #131e31;
    color: #53617a;
    font-size: 10px;
    text-align: center;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.header {
    height: 60px;
    min-height: 60px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    border-bottom: 1px solid #121d30;
    background: rgba(5,8,15,.88);
}

.sidebar-toggle {
    width: 35px;
    height: 35px;
    border: 1px solid #1b2d4b;
    border-radius: 9px;
    background: #0a1220;
    color: #9db5d9;
    cursor: pointer;
    font-size: 17px;
}

.header-info {
    flex: 1;
}

.header-title {
    font-size: 14px;
    font-weight: bold;
}

.header-status {
    display: flex;
    align-items: center;
    gap: 5px;
    color: #64738c;
    font-size: 10px;
    margin-top: 2px;
}

.online-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2f9bff;
    box-shadow: 0 0 8px #2f9bff;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px 110px;
}

.chat-inner {
    width: 100%;
    max-width: 820px;
    margin: auto;
}

.welcome {
    text-align: center;
    margin: 70px auto 35px;
    max-width: 520px;
}

.welcome-logo {
    width: 62px;
    height: 62px;
    margin: 0 auto 18px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg,#081a37,#123c79);
    border: 1px solid #1d4d91;
    box-shadow: 0 0 35px rgba(20,75,155,.22);
    font-size: 27px;
}

.welcome h1 {
    font-size: 26px;
    margin-bottom: 8px;
}

.welcome p {
    color: #718099;
    font-size: 13px;
    line-height: 1.5;
}

/* MESAJLAR */

.message {
    display: flex;
    margin-bottom: 14px;
}

.message.user {
    justify-content: flex-end;
}

.message.ai {
    justify-content: flex-start;
}

.message-content {
    display: flex;
    flex-direction: column;
    max-width: 78%;
}

.message-name {
    font-size: 10px;
    font-weight: bold;
    color: #6f8fbd;
    margin-bottom: 4px;
    padding: 0 4px;
}

.message.user .message-name {
    color: #4f8fe8;
    text-align: right;
}

.message.ai .message-name {
    color: #6f91c0;
}

.message-box {
    padding: 10px 13px;
    border-radius: 13px;
    font-size: 13px;
    line-height: 1.45;

    /* Gereksiz satır boşluklarını kaldırır */
    white-space: normal;

    word-wrap: break-word;
}

.message.user .message-box {
    background: linear-gradient(135deg,#12366d,#0e2955);
    border: 1px solid #1c4d91;
    color: #eaf2ff;
    border-bottom-right-radius: 4px;
}

.message.ai .message-box {
    background: #0b111d;
    border: 1px solid #18263d;
    color: #d6deec;
    border-bottom-left-radius: 4px;
}

/* TYPING */

.typing {
    display: none;
    width: fit-content;
    background: #0b111d;
    border: 1px solid #18263d;
    padding: 9px 12px;
    border-radius: 12px;
}

.typing span {
    display: inline-block;
    width: 5px;
    height: 5px;
    background: #5f88c4;
    border-radius: 50%;
    margin: 0 2px;
    animation: typing 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {
    0%,60%,100% {
        transform: translateY(0);
        opacity: .4;
    }

    30% {
        transform: translateY(-4px);
        opacity: 1;
    }
}

/* INPUT */

.input-area {
    position: fixed;
    bottom: 0;
    left: 260px;
    right: 0;
    padding: 12px 20px 16px;
    background: linear-gradient(transparent,#05070d 35%);
    transition: .25s ease;
}

.app.sidebar-closed .input-area {
    left: 0;
}

.input-wrap {
    max-width: 820px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: #0a101c;
    border: 1px solid #1a2b45;
    border-radius: 14px;
    padding: 7px;
}

textarea {
    flex: 1;
    min-height: 38px;
    max-height: 130px;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: #eaf0fb;
    padding: 9px 10px;
    font-size: 13px;
    line-height: 20px;
}

textarea::placeholder {
    color: #53627a;
}

.send-btn {
    width: 38px;
    height: 38px;
    border: 1px solid #24528f;
    border-radius: 10px;
    background: linear-gradient(135deg,#12366b,#0d2851);
    color: #dceaff;
    cursor: pointer;
    font-size: 16px;
}

.send-btn:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.input-note {
    max-width: 820px;
    margin: 5px auto 0;
    text-align: center;
    color: #46536a;
    font-size: 9px;
}

/* MOBİL */

@media (max-width:700px) {

    .sidebar {
        position: fixed;
        z-index: 20;
        height: 100vh;
        box-shadow: 10px 0 30px rgba(0,0,0,.4);
    }

    .input-area {
        left: 0;
        padding-left: 10px;
        padding-right: 10px;
    }

    .chat {
        padding-left: 10px;
        padding-right: 10px;
    }

    .message-content {
        max-width: 88%;
    }

    .welcome {
        margin-top: 45px;
    }

    .welcome h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="app" id="app">

<aside class="sidebar">

    <div class="sidebar-top">

        <div class="brand">

            <div class="brand-icon">⚡</div>

            <div class="brand-text">
                <strong>Commando AI</strong>
                <span>Yapay Zeka Asistanı</span>
            </div>

        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ Yeni Sohbet
        </button>

    </div>

    <div class="history-title">
        Sohbetler
    </div>

    <div class="conversation-list" id="conversationList"></div>

    <div class="sidebar-footer">
        Commando AI • 2026
    </div>

</aside>


<main class="main">

<header class="header">

    <button
        class="sidebar-toggle"
        onclick="toggleSidebar()"
    >
        ☰
    </button>

    <div class="header-info">

        <div class="header-title">
            Commando AI
        </div>

        <div class="header-status">
            <span class="online-dot"></span>
            Çevrimiçi
        </div>

    </div>

</header>


<section class="chat" id="chat">

    <div class="chat-inner" id="chatInner">

        <div class="welcome" id="welcome">

            <div class="welcome-logo">
                ⚡
            </div>

            <h1>Commando AI</h1>

            <p>
                Sorularını sor, fikirlerini paylaş veya
                herhangi bir konuda yardım al.
            </p>

        </div>

    </div>

</section>


<div class="input-area">

    <div class="input-wrap">

        <textarea
            id="messageInput"
            placeholder="Commando AI'a bir şey sor..."
            rows="1"
        ></textarea>

        <button
            class="send-btn"
            id="sendBtn"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

    <div class="input-note">
        Commando AI hata yapabilir. Önemli bilgileri kontrol edin.
    </div>

</div>

</main>

</div>


<script>

const STORAGE_KEY = "commando_ai_conversations";

let conversations =
    JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

let currentConversationId = null;

const chatInner =
    document.getElementById("chatInner");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const conversationList =
    document.getElementById("conversationList");


function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


function toggleSidebar() {

    document
        .getElementById("app")
        .classList.toggle("sidebar-closed");

}


function saveConversations() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(conversations)
    );

}


function newChat() {

    currentConversationId = null;

    chatInner.innerHTML = `

        <div class="welcome" id="welcome">

            <div class="welcome-logo">
                ⚡
            </div>

            <h1>Commando AI</h1>

            <p>
                Sorularını sor, fikirlerini paylaş veya
                herhangi bir konuda yardım al.
            </p>

        </div>
    `;

    renderConversations();

    messageInput.focus();
}


function createConversation() {

    const conversation = {

        id: Date.now(),

        title: "Yeni Sohbet",

        messages: []

    };

    conversations.unshift(conversation);

    currentConversationId =
        conversation.id;

    saveConversations();

    renderConversations();

    return conversation;
}


function renderConversations() {

    conversationList.innerHTML = "";

    conversations.forEach(conversation => {

        const item =
            document.createElement("div");

        item.className =
            "conversation" +
            (
                conversation.id ===
                currentConversationId
                    ? " active"
                    : ""
            );

        item.innerHTML = `

            <span>💬</span>

            <div class="conversation-title">
                ${escapeHtml(conversation.title)}
            </div>

            <div class="conversation-actions">

                <button
                    onclick="event.stopPropagation(); togglePin(${conversation.id})"
                >
                    ${conversation.pinned ? "📌" : "📍"}
                </button>

                <button
                    onclick="event.stopPropagation(); deleteConversation(${conversation.id})"
                >
                    🗑
                </button>

            </div>
        `;

        item.onclick = () =>
            loadConversation(conversation.id);

        conversationList.appendChild(item);

    });

}


function loadConversation(id) {

    const conversation =
        conversations.find(c => c.id === id);

    if (!conversation) return;

    currentConversationId = id;

    chatInner.innerHTML = "";

    if (conversation.messages.length === 0) {

        chatInner.innerHTML = `

            <div class="welcome">

                <div class="welcome-logo">
                    ⚡
                </div>

                <h1>Commando AI</h1>

                <p>Yeni sohbet başladı.</p>

            </div>
        `;

    } else {

        conversation.messages.forEach(message => {

            addMessage(
                message.role,
                message.content,
                false
            );

        });

    }

    renderConversations();

}


function addMessage(role, content, scroll = true) {

    const message =
        document.createElement("div");

    message.className =
        "message " + role;

    const name =
        role === "user"
            ? "Sen"
            : "Commando AI";

    /*
       trim() sayesinde cevabın başındaki
       ve sonundaki gereksiz boşluklar temizlenir.
    */

    const cleanContent =
        String(content || "").trim();

    message.innerHTML = `

        <div class="message-content">

            <div class="message-name">
                ${name}
            </div>

            <div class="message-box">
                ${escapeHtml(cleanContent)}
            </div>

        </div>
    `;

    chatInner.appendChild(message);

    if (scroll) {

        const chat =
            document.getElementById("chat");

        chat.scrollTop =
            chat.scrollHeight;

    }

}


function showTyping() {

    const typing =
        document.createElement("div");

    typing.className = "message ai";

    typing.id = "typingMessage";

    typing.innerHTML = `

        <div class="message-content">

            <div class="message-name">
                Commando AI
            </div>

            <div
                class="typing"
                style="display:block"
            >
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    `;

    chatInner.appendChild(typing);

    const chat =
        document.getElementById("chat");

    chat.scrollTop =
        chat.scrollHeight;

}


function hideTyping() {

    const typing =
        document.getElementById("typingMessage");

    if (typing) {
        typing.remove();
    }

}


async function sendMessage() {

    const message =
        messageInput.value.trim();

    if (!message) return;

    sendBtn.disabled = true;

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    if (!currentConversationId) {
        createConversation();
    }

    const conversation =
        conversations.find(
            c => c.id === currentConversationId
        );

    addMessage("user", message);

    conversation.messages.push({

        role: "user",

        content: message

    });

    if (conversation.title === "Yeni Sohbet") {

        conversation.title =
            message.length > 30
                ? message.substring(0,30) + "..."
                : message;

    }

    saveConversations();

    renderConversations();

    messageInput.value = "";

    autoResize();

    showTyping();

    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            });

        const data =
            await response.json();

        hideTyping();

        if (data.blocked) {

            addMessage(
                "ai",
                data.reply
            );

            conversation.messages.push({

                role: "assistant",

                content: data.reply

            });

            saveConversations();

            return;
        }

        const reply =
            data.reply ||
            data.output ||
            "Üzgünüm, cevap oluşturulamadı.";

        addMessage(
            "ai",
            reply
        );

        conversation.messages.push({

            role: "assistant",

            content: reply

        });

        saveConversations();

    }

    catch (error) {

        console.error(error);

        hideTyping();

        addMessage(
            "ai",
            "Sunucuya bağlanırken bir hata oluştu."
        );

    }

    finally {

        sendBtn.disabled = false;

        messageInput.focus();

    }

}


function deleteConversation(id) {

    conversations =
        conversations.filter(
            c => c.id !== id
        );

    if (currentConversationId === id) {
        newChat();
    }

    saveConversations();

    renderConversations();

}


function togglePin(id) {

    const conversation =
        conversations.find(
            c => c.id === id
        );

    if (!conversation) return;

    conversation.pinned =
        !conversation.pinned;

    conversations.sort(
        (a,b) =>
            Number(b.pinned) -
            Number(a.pinned)
    );

    saveConversations();

    renderConversations();

}


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


messageInput.addEventListener(
    "input",
    autoResize
);


function autoResize() {

    messageInput.style.height = "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            130
        ) + "px";

}


renderConversations();

</script>

</body>
</html>
```
