<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commando AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080b12;
    color: #fff;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

/* SOL MENÜ */
.sidebar {
    width: 280px;
    background: #0d111a;
    border-right: 1px solid #202633;
    display: flex;
    flex-direction: column;
    padding: 18px;
    transition: width .25s ease, opacity .25s ease, padding .25s ease;
    overflow: hidden;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
}

.logo-icon {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, #5865f2, #7c3aed);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    box-shadow: 0 0 20px rgba(88, 101, 242, .3);
}

.logo-text {
    font-size: 19px;
    font-weight: 700;
    white-space: nowrap;
}

.logo-text span {
    display: block;
    color: #8d96a8;
    font-size: 11px;
    margin-top: 3px;
    font-weight: 400;
}

.new-chat {
    width: 100%;
    border: 1px solid #303849;
    background: #151b27;
    color: white;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    font-size: 14px;
    transition: .2s;
    margin-bottom: 20px;
}

.new-chat:hover {
    background: #202838;
    border-color: #5865f2;
}

.section-title {
    color: #747e91;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 9px;
}

.conversations {
    flex: 1;
    overflow-y: auto;
}

.conversation {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    border-radius: 9px;
    margin-bottom: 5px;
    cursor: pointer;
    color: #cbd1dc;
    transition: .2s;
}

.conversation:hover {
    background: #171e2b;
}

.conversation.active {
    background: #1d2535;
    color: white;
}

.conversation-title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13px;
}

.conversation button {
    border: 0;
    background: transparent;
    color: #778197;
    cursor: pointer;
    font-size: 14px;
    padding: 3px;
}

.conversation button:hover {
    color: white;
}

.sidebar-footer {
    border-top: 1px solid #202633;
    padding-top: 15px;
    color: #727c8f;
    font-size: 12px;
    white-space: nowrap;
}

/* ANA ALAN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
}

/* MENÜ AÇ/KAPAT */
.sidebar-toggle {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 1000;

    width: 40px;
    height: 40px;

    border: 1px solid #303849;
    border-radius: 10px;

    background: #121824;
    color: white;

    cursor: pointer;
    font-size: 18px;

    transition: .2s;
}

.sidebar-toggle:hover {
    background: #202838;
    border-color: #5865f2;
    transform: scale(1.04);
}

/* MENÜ KAPALI */
.app.sidebar-closed .sidebar {
    width: 0;
    opacity: 0;
    padding-left: 0;
    padding-right: 0;
    border-right: 0;
}

.app.sidebar-closed .main {
    width: 100%;
}

/* ÜST BAR */
.header {
    height: 70px;
    border-bottom: 1px solid #202633;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 25px;
    background: rgba(8, 11, 18, .92);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.bot-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5865f2, #7c3aed);
    display: flex;
    align-items: center;
    justify-content: center;
}

.header-name {
    font-weight: 600;
}

.status {
    color: #48d597;
    font-size: 11px;
    margin-top: 3px;
}

.status::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #48d597;
    border-radius: 50%;
    margin-right: 5px;
}

/* MESAJ ALANI */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
}

.message {
    max-width: 850px;
    margin: 0 auto 22px;
    display: flex;
    gap: 12px;
}

.message-avatar {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #171e2b;
}

.message.user .message-avatar {
    background: #263149;
}

.message-content {
    flex: 1;
    line-height: 1.6;
    font-size: 14px;
    color: #dce1ea;
    white-space: pre-wrap;
    word-break: break-word;
}

.message-name {
    font-size: 12px;
    font-weight: 600;
    color: #8e98aa;
    margin-bottom: 4px;
}

/* GİRİŞ */
.input-area {
    padding: 18px 25px 25px;
    background: linear-gradient(transparent, #080b12 25%);
}

.input-box {
    max-width: 850px;
    margin: auto;
    background: #121824;
    border: 1px solid #293244;
    border-radius: 15px;
    display: flex;
    align-items: flex-end;
    padding: 10px;
    transition: .2s;
}

.input-box:focus-within {
    border-color: #5865f2;
    box-shadow: 0 0 0 3px rgba(88, 101, 242, .1);
}

textarea {
    flex: 1;
    resize: none;
    max-height: 150px;
    min-height: 42px;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    font-family: inherit;
    font-size: 14px;
    padding: 11px;
}

textarea::placeholder {
    color: #687287;
}

.send {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 11px;
    background: #5865f2;
    color: white;
    cursor: pointer;
    font-size: 17px;
    transition: .2s;
}

.send:hover {
    background: #6875ff;
    transform: translateY(-1px);
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}

.disclaimer {
    text-align: center;
    color: #535d70;
    font-size: 10px;
    margin-top: 9px;
}

/* YAZIYOR ANİMASYONU */
.typing {
    display: inline-flex;
    gap: 4px;
    padding: 8px 0;
}

.typing span {
    width: 6px;
    height: 6px;
    background: #7d8799;
    border-radius: 50%;
    animation: typing 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {
    0%, 60%, 100% {
        opacity: .3;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-4px);
    }
}

/* MOBİL */
@media (max-width: 700px) {

    .sidebar {
        position: fixed;
        z-index: 900;
        height: 100vh;
        left: 0;
        top: 0;
    }

    .app.sidebar-closed .sidebar {
        width: 0;
    }

    .chat {
        padding: 20px 14px;
    }

    .header {
        padding: 0 15px;
    }

    .input-area {
        padding: 12px;
    }

    .message {
        gap: 8px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SOL SOHBET MENÜSÜ -->
    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                🤖
            </div>

            <div class="logo-text">
                Commando AI
                <span>Yapay zeka asistanı</span>
            </div>

        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ Yeni Sohbet
        </button>

        <div class="section-title">
            Sohbetler
        </div>

        <div id="conversationList" class="conversations"></div>

        <div class="sidebar-footer">
            Commando AI • v1.0
        </div>

    </aside>


    <!-- ANA ALAN -->
    <main class="main">

        <!-- SOHBET MENÜSÜ AÇ/KAPAT -->
        <button
            class="sidebar-toggle"
            onclick="toggleSidebar()"
            title="Sohbet menüsünü aç/kapat"
        >
            ☰
        </button>


        <header class="header">

            <div class="header-left">

                <div class="bot-avatar">
                    🤖
                </div>

                <div>

                    <div class="header-name">
                        Commando AI
                    </div>

                    <div class="status">
                        Çevrimiçi
                    </div>

                </div>

            </div>

        </header>


        <section id="chat" class="chat"></section>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Commando AI'ya bir şey sor..."
                    rows="1"
                ></textarea>

                <button
                    id="sendButton"
                    class="send"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

            <div class="disclaimer">
                Commando AI hata yapabilir. Önemli bilgileri kontrol edin.
            </div>

        </div>

    </main>

</div>


<script>

/* =========================
   COMMando AI SOHBET SİSTEMİ
   ========================= */

const STORAGE_KEY = "commando_ai_conversations";

let conversations = [];
let activeConversationId = null;


/* ID */
function createId() {

    return Date.now().toString()
        + Math.random().toString(36).slice(2);

}


/* HTML GÜVENLİĞİ */
function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* KAYDET */
function saveConversations() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(conversations)
    );

}


/* YÜKLE */
function loadConversations() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (saved) {

        try {

            conversations =
                JSON.parse(saved);

        } catch {

            conversations = [];

        }

    }

    if (!conversations.length) {

        createConversation();

    } else {

        activeConversationId =
            conversations[0].id;

    }

    renderConversationList();
    renderActiveConversation();

}


/* YENİ SOHBET */
function createConversation() {

    const conversation = {

        id: createId(),

        title: "Yeni Sohbet",

        pinned: false,

        messages: [

            {
                role: "ai",
                text:
                    "Merhaba! Ben Commando AI. 👋\n\n" +
                    "Sana nasıl yardımcı olabilirim?"
            }

        ]

    };

    conversations.unshift(conversation);

    activeConversationId =
        conversation.id;

    saveConversations();

    renderConversationList();
    renderActiveConversation();

}


/* YENİ SOHBET */
function newChat() {

    createConversation();

}


/* AKTİF SOHBET */
function getActiveConversation() {

    return conversations.find(
        c => c.id === activeConversationId
    );

}


/* SOHBET LİSTESİ */
function renderConversationList() {

    const list =
        document.getElementById(
            "conversationList"
        );

    list.innerHTML = "";

    const sorted =
        [...conversations].sort(
            (a, b) =>
                Number(b.pinned) -
                Number(a.pinned)
        );

    sorted.forEach(conversation => {

        const item =
            document.createElement("div");

        item.className =
            "conversation" +
            (
                conversation.id ===
                activeConversationId
                    ? " active"
                    : ""
            );

        item.innerHTML = `

            <span>💬</span>

            <div class="conversation-title">
                ${escapeHtml(conversation.title)}
            </div>

            <button
                onclick="
                    event.stopPropagation();
                    togglePin('${conversation.id}')
                "
                title="Sabitle"
            >
                ${
                    conversation.pinned
                        ? "📌"
                        : "📍"
                }
            </button>

            <button
                onclick="
                    event.stopPropagation();
                    deleteConversation('${conversation.id}')
                "
                title="Sil"
            >
                🗑️
            </button>

        `;

        item.onclick =
            () => openConversation(
                conversation.id
            );

        list.appendChild(item);

    });

}


/* SOHBET AÇ */
function openConversation(id) {

    activeConversationId = id;

    renderConversationList();

    renderActiveConversation();

}


/* SOHBETİ GÖSTER */
function renderActiveConversation() {

    const chat =
        document.getElementById("chat");

    chat.innerHTML = "";

    const conversation =
        getActiveConversation();

    if (!conversation) return;

    conversation.messages.forEach(
        message => {

            addMessageToScreen(
                message.role,
                message.text
            );

        }
    );

    chat.scrollTop =
        chat.scrollHeight;

}


/* MESAJ EKLE */
function addMessageToScreen(
    role,
    text
) {

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message " + role;

    const avatar =
        role === "user"
            ? "👤"
            : "🤖";

    const name =
        role === "user"
            ? "Sen"
            : "Commando AI";

    message.innerHTML = `

        <div class="message-avatar">
            ${avatar}
        </div>

        <div class="message-content">

            <div class="message-name">
                ${name}
            </div>

            ${escapeHtml(text)}

        </div>

    `;

    chat.appendChild(message);

}


/* BAŞLIK */
function updateConversationTitle(
    conversation,
    message
) {

    if (
        conversation.title !==
        "Yeni Sohbet"
    ) return;

    const clean =
        message.trim();

    conversation.title =
        clean.length > 28
            ? clean.substring(0, 28) + "..."
            : clean;

}


/* SABİTLE */
function togglePin(id) {

    const conversation =
        conversations.find(
            c => c.id === id
        );

    if (!conversation) return;

    conversation.pinned =
        !conversation.pinned;

    saveConversations();

    renderConversationList();

}


/* SİL */
function deleteConversation(id) {

    conversations =
        conversations.filter(
            c => c.id !== id
        );

    if (!conversations.length) {

        createConversation();

        return;

    }

    if (
        activeConversationId === id
    ) {

        activeConversationId =
            conversations[0].id;

    }

    saveConversations();

    renderConversationList();

    renderActiveConversation();

}


/* YAZIYOR */
function showTyping() {

    const chat =
        document.getElementById("chat");

    const typing =
        document.createElement("div");

    typing.id =
        "typingIndicator";

    typing.className =
        "message ai";

    typing.innerHTML = `

        <div class="message-avatar">
            🤖
        </div>

        <div class="message-content">

            <div class="message-name">
                Commando AI
            </div>

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;

    chat.appendChild(typing);

    chat.scrollTop =
        chat.scrollHeight;

}


/* MESAJ GÖNDER */
async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const button =
        document.getElementById(
            "sendButton"
        );

    const message =
        input.value.trim();

    if (!message) return;

    const conversation =
        getActiveConversation();

    if (!conversation) return;


    /* KULLANICI MESAJI */
    conversation.messages.push({

        role: "user",

        text: message

    });

    updateConversationTitle(
        conversation,
        message
    );

    saveConversations();

    addMessageToScreen(
        "user",
        message
    );


    input.value = "";

    input.style.height =
        "auto";

    button.disabled =
        true;

    showTyping();


    try {

        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                }
            );


        const data =
            await response.json();


        const typing =
            document.getElementById(
                "typingIndicator"
            );

        if (typing) {
            typing.remove();
        }


        const reply =
            data.reply ||
            data.error ||
            "Bir hata oluştu.";


        conversation.messages.push({

            role: "ai",

            text: reply

        });


        saveConversations();


        addMessageToScreen(
            "ai",
            reply
        );


        renderConversationList();


    } catch (error) {

        const typing =
            document.getElementById(
                "typingIndicator"
            );

        if (typing) {
            typing.remove();
        }


        const errorMessage =
            "Sunucuya bağlanırken bir hata oluştu.";


        conversation.messages.push({

            role: "ai",

            text: errorMessage

        });


        saveConversations();


        addMessageToScreen(
            "ai",
            errorMessage
        );

    }


    button.disabled =
        false;

    input.focus();

}


/* ENTER */
document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* TEXTAREA OTOMATİK BÜYÜME */
document
    .getElementById("messageInput")
    .addEventListener(
        "input",
        function() {

            this.style.height =
                "auto";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    150
                ) + "px";

        }
    );


/* MENÜ AÇ / KAPAT */
function toggleSidebar() {

    const app =
        document.querySelector(".app");

    app.classList.toggle(
        "sidebar-closed"
    );

}


/* BAŞLAT */
loadConversations();

</script>

</body>
</html>
