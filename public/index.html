<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commando AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: white;
            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, rgba(100, 50, 255, 0.20), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(0, 150, 255, 0.15), transparent 35%),
                linear-gradient(135deg, #050509, #0b0714, #030409);

            position: relative;
        }

        /* Arka plan ışıkları */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            animation: hareket 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        body::before {
            background: #713cff;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #008cff;
            right: -100px;
            bottom: -100px;
            animation-delay: 2s;
        }

        @keyframes hareket {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(80px, 50px);
            }
        }

        .container {
            position: relative;
            z-index: 1;

            width: 95%;
            max-width: 900px;
            height: 90vh;

            margin: 5vh auto;

            background: rgba(10, 10, 18, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 25px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 0 50px rgba(80, 40, 255, 0.15),
                inset 0 0 30px rgba(255, 255, 255, 0.02);

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 22px;
            text-align: center;
            font-size: 25px;
            font-weight: bold;

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            background: rgba(255, 255, 255, 0.03);
        }

        .status {
            margin-top: 6px;
            font-size: 12px;
            color: #7cffb2;
            font-weight: normal;
        }

        #chat {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .message {
            max-width: 75%;
            padding: 13px 17px;
            margin-bottom: 15px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .ai {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-right: auto;
        }

        .user {
            background: linear-gradient(135deg, #603cff, #874cff);
            margin-left: auto;
            box-shadow: 0 5px 20px rgba(90, 50, 255, 0.25);
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 18px;

            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.25);
        }

        #message {
            flex: 1;
            padding: 15px 18px;

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 15px;

            outline: none;
            background: rgba(255, 255, 255, 0.06);
            color: white;

            font-size: 15px;
        }

        #message::placeholder {
            color: #999;
        }

        #message:focus {
            border-color: rgba(130, 90, 255, 0.8);
            box-shadow: 0 0 15px rgba(100, 60, 255, 0.15);
        }

        button {
            padding: 0 22px;
            border: none;
            border-radius: 15px;

            color: white;
            font-weight: bold;
            cursor: pointer;

            background: linear-gradient(135deg, #603cff, #914dff);

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(100, 60, 255, 0.4);
        }

        button:active {
            transform: scale(0.96);
        }

        /* Kaydırma çubuğu */
        #chat::-webkit-scrollbar {
            width: 6px;
        }

        #chat::-webkit-scrollbar-thumb {
            background: #603cff;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .container {
                width: 100%;
                height: 100vh;
                margin: 0;
                border-radius: 0;
            }

            .message {
                max-width: 85%;
            }

            button {
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            🤖 Commando AI
            <div class="status">● Çevrimiçi</div>
        </header>

        <div id="chat">
            <div class="message ai">
                Merhaba! Ben Commando AI. 👋
            </div>
        </div>

        <div class="input-area">
            <input
                id="message"
                type="text"
                placeholder="Commando AI'ya bir şey sor..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                Gönder
            </button>
        </div>

    </div>

    <script>
        const input = document.getElementById("message");
        const chat = document.getElementById("chat");

        input.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = input.value.trim();

            if (!message) return;

            chat.innerHTML += `
                <div class="message user">
                    ${message}
                </div>
            `;

            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                chat.innerHTML += `
                    <div class="message ai">
                        ${data.reply || "Bir hata oluştu."}
                    </div>
                `;

                chat.scrollTop = chat.scrollHeight;

            } catch (error) {

                chat.innerHTML += `
                    <div class="message ai">
                        Sunucuya bağlanırken bir hata oluştu.
                    </div>
                `;

                chat.scrollTop = chat.scrollHeight;
            }
        }
    </script>

</body>
</html>
